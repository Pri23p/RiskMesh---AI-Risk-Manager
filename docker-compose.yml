services:
  postgres:
    image: postgres:16-alpine
    container_name: risksentinel-postgres
    environment:
      POSTGRES_DB: risksentinel_db
      POSTGRES_USER: merchant_user
      POSTGRES_PASSWORD: merchant_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchant_user -d risksentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    container_name: risksentinel-ml-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: risksentinel-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://merchant_user:merchant_secure_password@postgres:5432/risksentinel_db?schema=public
      - ML_SERVICE_URL=http://ml-service:8000
      - LOG_LEVEL=info
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: risksentinel-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - ml-service
    restart: unless-stopped

volumes:
  postgres_data:
